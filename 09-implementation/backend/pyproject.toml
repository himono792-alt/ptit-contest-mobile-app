[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptit-contest-backend"
version = "0.1.0"
description = "PTIT Contest Management System - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.18",
    # Phase 1 step 1 (2026-05-06): Sentry error tracking + performance monitoring
    "sentry-sdk[fastapi]>=2.18.0",
    # Phase 1 step 2 (2026-05-06): rate limit để chống brute force + DDoS
    # slowapi storage default = memory (đủ cho 1 replica), upgrade sang Redis qua REDIS_URL
    "slowapi>=0.1.9",
    "redis>=5.2.0",   # optional, chỉ dùng nếu REDIS_URL env var có
    # Phase 1 step 4 (2026-05-06): Email service production
    # Migrate evening 2026-05-06: SMTP (aiosmtplib port 587) -> HTTP API (httpx port 443)
    # vì Railway hobby block outbound port 587. httpx đã có sẵn cho dev deps.
    # jinja2: render template HTML email (password reset, welcome, OTP, notification)
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    # Phase 2 sprint 1 step 3 (2026-05-06): Excel export contest results
    # openpyxl: write .xlsx files in-memory (lighter than pandas, không cần numpy)
    "openpyxl>=3.1.0",
    # Sprint 3 (2026-05-07): Cloudflare R2 object storage cho submission files.
    # aiobotocore = async wrapper boto3 dùng cùng asyncpg event loop của FastAPI.
    # R2 S3-compatible nên dùng client "s3" với endpoint_url = R2.
    "aiobotocore>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
