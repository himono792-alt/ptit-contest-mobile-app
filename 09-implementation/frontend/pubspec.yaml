name: ptit_contest
description: PTIT Contest Management — Flutter app (web + APK)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.6.1
  # HTTP
  dio: ^5.7.0
  # Routing
  go_router: ^14.6.2
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # JWT decode
  jwt_decoder: ^2.0.1
  # Utils
  intl: ^0.19.0
  # Typography — Google Fonts (Plus Jakarta Sans, JetBrains Mono)
  google_fonts: ^6.2.1
  # File picker for submission upload
  file_picker: ^8.1.2
  # HTTP multipart upload (Dio đã có sẵn FormData)
  # Phase 2 sprint 1 step 4 (2026-05-06): biometric login (FaceID/TouchID/Fingerprint)
  # APK Android only — web sẽ skip qua kIsWeb check.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
