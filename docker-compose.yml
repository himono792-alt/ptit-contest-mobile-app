# PTIT Contest — Full stack docker-compose
#
# Cách dùng (tại root repo):
#   docker compose up -d        # build + start tất cả service
#   docker compose logs -f      # xem log
#   docker compose down         # stop
#   docker compose down -v      # stop + xóa data postgres
#
# Sau khi up:
#   - Backend API:  http://localhost:8000/api/docs
#   - Frontend web: http://localhost:8080
#   - Postgres:     localhost:5432 (user/pass: ptit_contest / dev_password)
#
# LAN access (iPhone trên cùng WiFi):
#   - Lấy IP máy: ipconfig | findstr IPv4
#   - Build lại frontend: docker compose build --build-arg API_BASE=http://<IP>:8000 frontend
#   - iPhone vào: http://<IP>:8080

# Tên project Docker Compose — cố định, không phụ thuộc tên folder.
# Container/image/volume sẽ là ptit-contest-backend-1, ptit-contest_pg_data...
name: ptit-contest

services:
  # ============== PostgreSQL 16 ==============
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ptit_contest
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ptit_contest_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema do backend tự init từ init-schema.sql v04 (xem docker-entrypoint.sh).
      # KHÔNG mount file SQL ở đây để tránh 2 nguồn schema lệch nhau (v03 vs v04).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptit_contest -d ptit_contest_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============== Backend FastAPI ==============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ptit_contest:dev_password@postgres:5432/ptit_contest_db
      JWT_SECRET_KEY: change-this-to-random-32-byte-string-for-prod
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      # Link trong email (reset password/notification) + QR verify cert trỏ về web local.
      FRONTEND_BASE_URL: http://localhost:8080
      APP_ENV: production
      DEBUG: "false"
      # Mật khẩu cho toàn bộ tài khoản demo do seed-demo.py tạo (SV/GV/BCN/Admin).
      DEMO_PASSWORD: abc123
      # Thư mục lưu file pg_dump khi Admin bấm "Tạo backup" (POST /admin/backup).
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 4

  # ============== Frontend Flutter web (nginx) ==============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Sửa khi deploy: tới URL backend public
        API_BASE: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # ============== DBGate — web DB client (dbgate) ==============
  # DBGate chạy như container rời trong compose → mở http://localhost:4224.
  # Connection "PTIT Contest DB" được khai báo SẴN qua env → tự dựng lại trên MỌI
  # máy, không cần tạo tay, không phụ thuộc volume. SKIP_ALL_AUTH bỏ luôn đăng nhập.
  # Host = 'postgres' (tên service ở trên, qua mạng nội bộ Docker).
  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SKIP_ALL_AUTH: "1"            # bỏ màn đăng nhập DBGate
      CONNECTIONS: pg1              # khai báo sẵn 1 connection tên "pg1"
      LABEL_pg1: PTIT Contest DB
      SERVER_pg1: postgres
      USER_pg1: ptit_contest
      PASSWORD_pg1: dev_password
      PORT_pg1: "5432"
      ENGINE_pg1: postgres@dbgate-plugin-postgres
    ports:
      - "4224:3000"   # mở http://localhost:4224 (DBGate chạy cổng 3000 bên trong)
    volumes:
      - dbgate_data:/root/.dbgate

  # ============== DBX — web DB client (phương án xem DB thứ 2) ==============
  # DBX (t8y2/dbx) chạy song song DBGate → mở http://localhost:4225.
  # Đăng nhập bằng access password = DBX_PASSWORD (đặt 'abc123' cho khớp demo).
  # DBX KHÔNG nhận connection qua env → tạo 1 LẦN trong UI (lưu ở volume dbx_data):
  #     Type=PostgreSQL · Host=postgres · Port=5432 · User=ptit_contest
  #     Password=dev_password · Database=ptit_contest_db
  # (Host = 'postgres' = tên service, qua mạng nội bộ Docker — KHÔNG phải localhost.)
  dbx:
    image: t8y2/dbx
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DBX_PASSWORD: abc123
    ports:
      - "4225:4224"   # mở http://localhost:4225 (DBX chạy cổng 4224 bên trong)
    volumes:
      - dbx_data:/app/data

volumes:
  pg_data:
  dbgate_data:
  dbx_data:
  backups:
